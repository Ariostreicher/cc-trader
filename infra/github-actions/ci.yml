# Drop into .github/workflows/ci.yml at the repo root.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cctrader
          POSTGRES_USER: cctrader
          POSTGRES_PASSWORD: cctrader
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U cctrader"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: pip install -r backend/requirements.txt
      - name: Ruff
        run: |
          pip install ruff
          ruff check backend
      - name: Compile-check all .py files
        run: python -m compileall backend/app -q
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://cctrader:cctrader@localhost:5432/cctrader
          DATABASE_URL_SYNC: postgresql+psycopg2://cctrader:cctrader@localhost:5432/cctrader
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm install --legacy-peer-deps
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
