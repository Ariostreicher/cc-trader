name: CC Trader CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Compile-check
        run: python -c "import scan_setups; print('OK')"

      - name: Run E2E test suites
        run: |
          if [ -d tests ]; then
            for f in tests/test_*.py tests/e2e_*.py; do
              [ -f "$f" ] || continue
              echo "::group::Running $f"
              python "$f"
              echo "::endgroup::"
            done
          else
            echo "No tests/ directory found — skipping."
          fi
